# SonarCloud project configuration
# https://docs.sonarsource.com/sonarqube/latest/project-administration/analysis-parameters/

sonar.projectKey=Agustin-Perezz_next-supabase-scaffold
sonar.organization=general-organization
sonar.projectName=next-supabase-scaffold
sonar.projectDescription=Next.js (App Router) starter with Supabase, Clean Architecture, and Playwright E2E.

# Source code layout
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions — generated/vendored/build output should not be analyzed
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/*.d.ts,\
  **/database.types.ts,\
  **/next-env.d.ts,\
  **/supabase/migrations/**,\
  **/*.sql

# Test file patterns (counted as tests, not as production code)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage — two LCOV feeds combined (comma-separated, no merge step needed):
#   coverage/unit/lcov.info  → Vitest @vitest/coverage-v8 (Clean Architecture core:
#                             use-cases, entity validation, mappers — the server-side
#                             logic browser V8 coverage cannot see).
#   coverage/tests/lcov.info → Playwright/Monocart E2E (client-rendered components).
# Scope = the Clean Architecture core only. Outer layers are excluded from the
# coverage metric (still analyzed for bugs/smells/duplication) because they are
# either exercised by E2E, are framework/config glue, or are invisible to browser
# V8 coverage (Server Components, server actions). This keeps the gate on the code
# where bugs actually hide, without inflating the denominator with boilerplate.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**,\
  **/infrastructure/database/postgres/database.types.ts,\
  **/infrastructure/database/postgres/entities/**,\
  **/infrastructure/database/postgres/repositories/**,\
  **/*.dto.ts,\
  **/*.schema.ts,\
  **/*.enum.ts,\
  **/*.repository.interface.ts,\
  src/app/layout.tsx,\
  src/app/**/page.tsx,\
  src/app/**/loading.tsx,\
  src/app/**/error.tsx,\
  src/app/**/not-found.tsx,\
  src/app/**/route.ts,\
  src/app/**/actions.ts,\
  src/app/**/components/**,\
  src/proxy.ts,\
  src/components/ui/**,\
  src/hooks/useFileDropzone.ts,\
  src/lib/containers/**,\
  src/lib/shared/infrastructure/**,\
  src/lib/utils.ts,\
  src/lib/utils/**,\
  src/instrumentation.ts,\
  src/sentry.client.config.ts,\
  src/sentry.server.config.ts,\
  src/sentry.edge.config.ts,\
  src/domain/entities/errors.ts

# TypeScript-specific settings
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/unit/lcov.info,coverage/tests/lcov.info
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/tests/lcov.info

# Avoid false duplication flags on generated Supabase types
sonar.cpd.exclusions=**/database.types.ts

# Quality Gate is enforced via SonarCloud's GitHub PR decoration (project is bound to GitHub).
# The scanner does not poll the Quality Gate — SonarCloud posts it as a GitHub PR check instead.
# Enable branch protection on "SonarCloud Code Analysis" check to block merges on Quality Gate failure.
